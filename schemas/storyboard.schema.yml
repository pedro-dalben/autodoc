# yaml-language-server schema note
# Canonical storyboard schema lives in code: internal/storyboard/storyboard.go
# (Validate + PlaywrightSelector + SecretSentinels) and docs/storyboard.md.
# This file tracks the same contract for editors.
$schema: "http://json-schema.org/draft-07/schema#"
title: "AutoDoc storyboard"
type: object
required: [version, meta, scenes]
properties:
  version: {type: integer, const: 1}
  meta:
    type: object
    required: [title, language]
    properties:
      title: {type: string}
      description: {type: string}
      language: {type: string}
      resolution: {type: string}
      fps: {type: integer}
      author: {type: string}
  config:
    type: object
    properties:
      base_url: {type: string}
      viewport_width: {type: integer}
      viewport_height: {type: integer}
  setup:
    type: object
    properties:
      start_url: {type: string}
      storage_state: {type: string}
  redact:
    type: object
    properties:
      selectors: {type: array, items: {type: string}}
      mask_password_inputs: {type: boolean}
  scenes:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, beats]
      properties:
        id: {type: string}
        title: {type: string}
        url: {type: string}
        screenshot: {type: boolean}
        beats:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, sequence]
            properties:
              id: {type: string}
              sequence:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    speech: {type: object}
                    action: {type: object}
                    wait: {type: object}
                    hold: {type: object}
