# yaml-language-server schema note
# Canonical storyboard schema lives in code: internal/storyboard/storyboard.go
# (Validate + PlaywrightSelector + SecretSentinels) and docs/storyboard.md.
# This file tracks the same contract for editors.
$schema: "http://json-schema.org/draft-07/schema#"
title: "AutoDoc storyboard"
type: object
required: [version, meta, scenes]
properties:
  version: {type: integer, enum: [1, 2]}
  meta:
    type: object
    required: [title, language]
    properties:
      title: {type: string}
      description: {type: string}
      language: {type: string}
      resolution: {type: string}
      fps: {type: integer}
      author: {type: string}
  config:
    type: object
    properties:
      base_url: {type: string}
      viewport_width: {type: integer}
      viewport_height: {type: integer}
  setup:
    type: object
    properties:
      start_url: {type: string}
      storage_state: {type: string}
      sequence:
        type: array
        items:
          type: object
          properties:
            action:
              type: object
              properties:
                type: {type: string}
                url: {type: string}
                value: {type: string}
                text: {type: string}
                key: {type: string}
                secret_ref: {type: string}
                instant: {type: boolean}
                no_zoom: {type: boolean}
                target: {type: object}
            wait:
              type: object
              properties:
                state: {type: string}
                url: {type: string}
                value: {type: string}
                timeout_ms: {type: integer}
                settle_ms: {type: integer}
                compressible: {type: boolean}
                target: {type: object}
  visuals:
    type: object
    description: "Cinematic overrides; omit for tuned defaults."
    properties:
      cursor: {type: object}
      click: {type: object}
      typing: {type: object}
      camera: {type: object}
      pacing: {type: object}
      sync: {type: object}
  direction:
    $ref: "#/definitions/direction"
  cinematic:
    type: object
    description: "AI Director overrides; omit for safe V2 defaults (director on, callouts/sound off)."
    properties:
      director: {type: boolean}
      attention:
        type: object
        properties:
          enabled: {type: boolean}
          spotlight: {type: boolean}
          max_dim: {type: number}
      camera:
        type: object
        properties:
          continuity: {type: boolean}
          context_restore: {type: boolean}
          max_zoom: {type: number}
          min_transition_ms: {type: integer}
      anticipation:
        type: object
        properties:
          enabled: {type: boolean}
          reveal_ms: {type: integer}
          approach_ms: {type: integer}
          settle_ms: {type: integer}
      results:
        type: object
        properties:
          confirmation: {type: boolean}
          min_hold_ms: {type: integer}
      editing:
        type: object
        properties:
          compress_dead_time: {type: boolean}
          max_speed: {type: number}
      callouts:
        type: object
        properties:
          enabled: {type: boolean}
          max_per_scene: {type: integer}
      sound:
        type: object
        properties:
          enabled: {type: boolean}
          click: {type: string}
          success: {type: string}
          typing: {type: boolean}
      qa:
        type: object
        properties:
          max_unintentional_static_ms: {type: integer}
          min_target_visible_ms: {type: integer}
          min_result_visible_ms: {type: integer}
  redact:
    type: object
    properties:
      selectors: {type: array, items: {type: string}}
      mask_password_inputs: {type: boolean}
  scenes:
    type: array
    minItems: 1
    items:
      type: object
      required: [id, beats]
      properties:
        id: {type: string}
        camera: {type: string}
        attention: {type: string}
        direction: {$ref: "#/definitions/direction"}
        id: {type: string}
        title: {type: string}
        url: {type: string}
        screenshot: {type: boolean}
        beats:
          type: array
          minItems: 1
          items:
            type: object
            required: [id, sequence]
            properties:
              id: {type: string}
              sequence:
                type: array
                minItems: 1
                items:
                  type: object
                  properties:
                    speech:
                      type: object
                      properties:
                        text: {type: string}
                        voice: {type: string}
                        pause_before_ms: {type: integer}
                        pause_after_ms: {type: integer}
                        anchor: {type: string}
                    action:
                      type: object
                      properties:
                        type: {type: string}
                        camera: {type: string}
                        attention: {type: string}
                        callout: {type: string}
                        direction: {$ref: "#/definitions/direction"}
                        no_anticipation: {type: boolean}
                        result_hold_ms: {type: integer}
                        result_target: {type: object}
                    wait: {type: object}
                    hold: {type: object}

definitions:
  direction:
    type: object
    description: "Explicit cinematic direction (semantic intent; unset=auto). Precedence: action>scene>tutorial>preset>director."
    properties:
      preset: {type: string, enum: [auto, minimal, balanced, dynamic, training]}
      camera: {type: string, enum: [auto, static, subtle, dynamic, follow, focus, wide]}
      zoom: {type: string, enum: [auto, off, subtle, medium, strong, extreme]}
      cursor: {type: string, enum: [auto, show, hide]}
      cursor_halo: {type: string, enum: [auto, off, on]}
      click: {type: string, enum: [auto, off, subtle, strong]}
      click_effect: {type: string, enum: [auto, none, ripple, ring, pulse, highlight]}
      typing: {type: string, enum: [auto, instant, natural, slow, fast]}
      keyboard: {type: string, enum: [auto, off, shortcuts, all]}
      spotlight: {type: string, enum: [auto, off, subtle, medium, strong]}
      focus: {type: string, enum: [auto, off, outline, pulse]}
      callout: {type: string, enum: [auto, off, on]}
      result: {type: string, enum: [auto, off, emphasize]}
      hold: {type: string, enum: [auto, short, normal, long]}
      transition: {type: string, enum: [auto, cut, smooth, none]}
      camera_lock: {type: string, enum: [auto, off, on]}
