name: release-validate

# Validates real published artifacts (including pre-releases) on every
# platform we ship. Runs automatically when a GitHub Release is published
# and on demand for any tag. Downloads only public assets: no Go toolchain,
# no source checkout of the tag under test.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to validate (e.g. v0.1.0-rc.1)"
        required: true

permissions:
  contents: read

env:
  VERSION: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Install pinned RC (no Go on PATH)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$VERSION/install.sh" -o install.sh
          env -i HOME="$HOME" PATH=/usr/bin:/bin \
            AUTODOC_VERSION="$VERSION" AUTODOC_INSTALL_DIR="$RUNNER_TEMP/autodoc-bin" \
            sh install.sh
      - name: Version must equal the tag
        run: |
          "$RUNNER_TEMP/autodoc-bin/autodoc" version | tee version.txt
          grep -q "$VERSION" version.txt
          "$RUNNER_TEMP/autodoc-bin/autodoc" --help > /dev/null
      - name: Explicit checksum validation
        run: |
          ASSET="autodoc_${VERSION#v}_linux_$(uname -m | sed -e 's/x86_64/amd64/' -e 's/aarch64/arm64/').tar.gz"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$VERSION/checksums.txt" -o checksums.txt
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$VERSION/$ASSET" -o "$ASSET"
          grep " $ASSET\$" checksums.txt > check-one.txt
          sha256sum -c check-one.txt
      - name: Reinstall and unknown version
        run: |
          env -i HOME="$HOME" PATH=/usr/bin:/bin \
            AUTODOC_VERSION="$VERSION" AUTODOC_INSTALL_DIR="$RUNNER_TEMP/autodoc-bin" \
            sh install.sh
          if env -i HOME="$HOME" PATH=/usr/bin:/bin \
            AUTODOC_VERSION=v0.0.0-does-not-exist AUTODOC_INSTALL_DIR="$RUNNER_TEMP/autodoc-bin" \
            sh install.sh; then
            echo "installer must fail for unknown version" >&2
            exit 1
          fi

  macos:
    runs-on: macos-latest
    steps:
      - name: Install pinned RC via install.sh
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/$VERSION/install.sh" -o install.sh
          AUTODOC_VERSION="$VERSION" AUTODOC_INSTALL_DIR="$RUNNER_TEMP/autodoc-bin" sh install.sh
      - name: Version must equal the tag
        run: |
          "$RUNNER_TEMP/autodoc-bin/autodoc" version | tee version.txt
          grep -q "$VERSION" version.txt
          "$RUNNER_TEMP/autodoc-bin/autodoc" --help > /dev/null
      - name: Explicit checksum validation
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$VERSION/checksums.txt" -o checksums.txt
          ASSET="autodoc_${VERSION#v}_darwin_${ARCH}.tar.gz"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$VERSION/$ASSET" -o "$ASSET"
          grep " $ASSET\$" checksums.txt > check-one.txt
          (command -v sha256sum > /dev/null && sha256sum -c check-one.txt) || shasum -a 256 -c check-one.txt

  windows:
    runs-on: windows-latest
    steps:
      - name: Install pinned RC via install.ps1 (real PowerShell)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest "https://raw.githubusercontent.com/${{ github.repository }}/$env:VERSION/install.ps1" -OutFile "$env:RUNNER_TEMP\install.ps1"
          $bindir = "$env:RUNNER_TEMP\autodoc-bin"
          & "$env:RUNNER_TEMP\install.ps1" -Version "$env:VERSION" -InstallDir $bindir
          $ver = & "$bindir\autodoc.exe" version
          Write-Host $ver
          if ($ver -notmatch [regex]::Escape($env:VERSION)) { throw "version mismatch: $ver" }
          & "$bindir\autodoc.exe" --help | Out-Null
          # Reinstall over the top must succeed.
          & "$env:RUNNER_TEMP\install.ps1" -Version "$env:VERSION" -InstallDir $bindir
      - name: Explicit checksum validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $arch = switch ($env:PROCESSOR_ARCHITECTURE) { "AMD64" { "amd64" } "ARM64" { "arm64" } default { throw "unsupported arch" } }
          $assetVer = $env:VERSION
          if ($assetVer.StartsWith("v")) { $assetVer = $assetVer.Substring(1) }
          $asset = "autodoc_${assetVer}_windows_$arch.zip"
          $base = "https://github.com/${{ github.repository }}/releases/download/$env:VERSION"
          Invoke-WebRequest "$base/$asset" -OutFile "$env:RUNNER_TEMP\$asset"
          Invoke-WebRequest "$base/checksums.txt" -OutFile "$env:RUNNER_TEMP\checksums.txt"
          $line = Select-String -Path "$env:RUNNER_TEMP\checksums.txt" -Pattern " $asset`$" | Select-Object -First 1
          if (-not $line) { throw "checksum entry missing for $asset" }
          $want = ($line.Line -split " ")[0]
          $got = (Get-FileHash "$env:RUNNER_TEMP\$asset" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $want.ToLower()) { throw "checksum mismatch for $asset" }
      - name: Unknown version must fail
        shell: pwsh
        run: |
          $bindir = "$env:RUNNER_TEMP\autodoc-bin"
          try {
            & "$env:RUNNER_TEMP\install.ps1" -Version "v0.0.0-does-not-exist" -InstallDir $bindir
            throw "installer must fail for unknown version"
          } catch {
            if ($_.Exception.Message -eq "installer must fail for unknown version") { throw }
            Write-Host "unknown version correctly rejected: $($_.Exception.Message)"
          }
